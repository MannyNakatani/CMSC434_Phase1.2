<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchen Kompanion</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tab6.css">
</head>

<body>
    <div class="phone">
        <div class="screen">
            <div class="tab-page" id="tab6">
                <h1>Shopping List</h1>
                <p id="shop-count"></p>

                <form id="shop-form" autocomplete="off" novalidate>
                    <input type="text" id="shop-name" placeholder="Add an item (e.g. milk)" aria-label="Item name">
                    <div class="shop-row">
                        <input type="number" id="shop-qty" value="1" min="1" aria-label="Quantity">
                        <select id="shop-unit" aria-label="Unit">
                            <option>item(s)</option>
                            <option>gallon</option>
                            <option>lb</option>
                            <option>oz</option>
                            <option>pack</option>
                            <option>dozen</option>
                        </select>
                        <button type="submit">Add</button>
                    </div>
                    <p id="shop-error"></p>
                </form>

                <ul id="shop-list"></ul>
            </div>

            <div class="tab-page" id="fridge">
                <h1>Fridge</h1>
            </div>

            <div class="tab-page" id="recipes">
                <h1>Recipes</h1>
            </div>

            <div class="tab-page" id="household">
                <h1>Household</h1>
            </div>
        </div>

        <nav class="navbar">
            <button class="tablink" onclick="openTab(event, 'tab6')">
                <img class="nav-icon" src="images/checklist.png" alt="">
                <span>Shopping</span>
            </button>

            <button class="tablink" onclick="openTab(event, 'fridge')">
                <img class="nav-icon" src="images/fridge.png" alt="">
                <span>Fridge</span>
            </button>

            <button class="tablink" onclick="openTab(event, 'recipes')">
                <img class="nav-icon" src="images/scroll-bar.png" alt="">
                <span>Recipes</span>
            </button>

            <button class="tablink" onclick="openTab(event, 'household')">
                <img class="nav-icon" src="images/user.png" alt="">
                <span>Household</span>
            </button>
        </nav>
    </div>

<script src="js/main.js"></script>
<script src="js/tab6.js"></script>
</body>
</html>
