<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kitchen Kompanion</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tab3.css">
    <link rel="stylesheet" href="css/tab6.css">
    <link rel="stylesheet" href="css/fridge.css">
</head>

<body>
    <div class="phone">
        <div class="screen">
            <div class="tab-page" id="tab6">
                <h1>Shopping List</h1>
                <p id="shop-count"></p>

                <form id="shop-form" autocomplete="off" novalidate>
                    <input type="text" id="shop-name" placeholder="Add an item (e.g. milk)" aria-label="Item name">
                    <div class="shop-row">
                        <input type="number" id="shop-qty" value="1" min="1" aria-label="Quantity">
                        <select id="shop-unit" aria-label="Unit">
                            <option>item(s)</option>
                            <option>gallon</option>
                            <option>lb</option>
                            <option>oz</option>
                            <option>pack</option>
                            <option>dozen</option>
                        </select>
                        <button type="submit">Add</button>
                    </div>
                    <p id="shop-error"></p>
                </form>

                <ul id="shop-list"></ul>
            </div>

            <div class="tab-page" id="fridge">
                <h1>Fridge</h1>

                <input type="text" id="fridge-search" placeholder="Search for an item">
                <button type="button" id="fridge-search-btn">Search</button>
                <button type="button" id="fridge-clear-btn">Clear</button>
                <p id="fridge-count"></p>
                <ul id="fridge-list"></ul>
            </div>

            <div class="tab-page" id="recipes">
                <h1>Recipes</h1>

                <div id="recipe-search">
                    <input
                        type="search"
                        id="recipe-query"
                        placeholder="Search recipes..."
                        aria-label="Search recipes by name"
                    >
                </div>

            
                <div id="recipe-filters">
                    <label for="recipe-filter">Show:</label>
                    <select id="recipe-filter">
                        <option value="all">All recipes</option>
                        <option value="favorites">Favorites</option>
                        <option value="expiring">Use soon</option>
                    </select>
                </div>


                <div id="recipe-results">
                    <p id="recipe-empty" hidden>
                        No recipes found. Try another search or filter.
                    </p>

                    <section class="recipe-section" id="expiring-section">
                        <h2>Use Soon</h2>
                        <div id="expiring-recipes" class="recipe-list"></div>
                    </section>

                    <section class="recipe-section" id="favorites-section">
                        <h2>Favorites</h2>
                        <div id="favorite-recipes" class="recipe-list"></div>
                    </section>

                    <section class="recipe-section" id="all-section">
                        <h2>All Recipes</h2>
                        <div id="all-recipes" class="recipe-list"></div>
                    </section>
                </div>
            </div>

            <div class="tab-page" id="household">
                <h1>Household</h1>
            </div>
        </div>

        <nav class="navbar">
            <button class="tablink" onclick="openTab(event, 'tab6')">
                <img class="nav-icon" src="images/checklist.png" alt="">
                <span>Shopping</span>
            </button>

            <button class="tablink" onclick="openTab(event, 'fridge')">
                <img class="nav-icon" src="images/fridge.png" alt="">
                <span>Fridge</span>
            </button>

            <button class="tablink" onclick="openTab(event, 'recipes')">
                <img class="nav-icon" src="images/scroll-bar.png" alt="">
                <span>Recipes</span>
            </button>

            <button class="tablink" onclick="openTab(event, 'household')">
                <img class="nav-icon" src="images/user.png" alt="">
                <span>Household</span>
            </button>
        </nav>
    </div>

<script src="js/main.js"></script>
    <script src="js/tab3.js"></script>
<script src="js/tab6.js"></script>
<script src="js/fridge.js"></script>
</body>
</html>
