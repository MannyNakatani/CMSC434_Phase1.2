<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <title>CMSC434 Phase 1.2</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/tab1.css">
    <link rel="stylesheet" href="css/tab2.css">
    <link rel="stylesheet" href="css/tab3.css">
    <link rel="stylesheet" href="css/tab5.css">
    <link rel="stylesheet" href="css/tab6.css">
</head>

<body>
    <div class="phone">
        <div class="screen">
            <div class="tab-page" id="tab1">
                <h1>Text</h1>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
                <p>Text</p>
            </div>

            <div class="tab-page" id="tab2">
                <h1>LR</h1>
                <p>Down Here</p>
            </div>

            <div class="tab-page" id="tab3">
                <h1>Colors</h1>
                <p class="yellow-black">Some text yellow on black</p>
                <p class="purple-yellow">Some text purple on yellow</p>
                <div class="pie-chart"></div>
            </div>

            <div class="tab-page" id="tab4">
                <h1>Profile</h1>
                <p>tab 4</p>
            </div>

            <div class="tab-page" id="tab5">
                <h1>Choices</h1>
                <p>Pick a meal</p>
                <label class="container">Breakfast
                    <input type="radio" name="meal" value="breakfast" checked>
                    <span class="checkmark"></span>
                </label>
                <label class="container">Lunch
                    <input type="radio" name="meal" value="lunch">
                    <span class="checkmark"></span>
                </label>
                <label class="container">Dinner
                    <input type="radio" name="meal" value="dinner">
                    <span class="checkmark"></span>
                </label>
                
                <p>Pick a food:</p>
                <select id="choiceSelect">
                    <option value="Pizza">Pizza</option>
                    <option value="Sushi">Sushi</option>
                    <option value="Burger">Burger</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Salad">Salad</option>
                </select>
                <br>
                
                <button id="choiceButton" onclick="showChoices()">Submit</button>
                <p id="choiceResult"></p>
            </div>

            <div class="tab-page" id="tab6">
                <h1>ToDo</h1>
                <form id="todo-form">
                    <input type="text" id="todo-input" placeholder="New entry..." autocomplete="off">
                    <button type="submit">Add</button>
                </form>
                <ul id="todo-list"></ul>
            </div>
        </div>

        <nav class="navbar">
            <button class="tablink" onclick="openTab(event, 'tab1')"><span class="nav-icon">Text</span></button>
            <button class="tablink" onclick="openTab(event, 'tab2')"><span class="nav-icon">LR</span></button>
            <button class="tablink" onclick="openTab(event, 'tab3')"><span class="nav-icon">Colors</span></button>
            <button class="tablink" onclick="openTab(event, 'tab4')"><span class="nav-icon">Profile</span></button>
            <button class="tablink" onclick="openTab(event, 'tab5')"><span class="nav-icon">Choices</span></button>
            <button class="tablink" onclick="openTab(event, 'tab6')"><span class="nav-icon">ToDo</span></button>
        </nav>
    </div>
<script src="js/main.js"></script>
<script src="js/tab5.js"></script>
<script src="js/tab6.js"></script>
</body>
</html>
